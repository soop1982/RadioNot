    def f = new File(rootDir, '.signing/debug.keystore')
    if (!f.exists()) {
        f.parentFile.mkdirs()
        f.bytes = java.util.Base64.decoder.decode(SIGNING_KEY_B64)
    }
    return f
}

android {
    namespace 'pl.prosteradio'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.prosteradio'
        minSdk 19          // Android 4.4 KitKat
        targetSdk 28
        versionCode 4
        versionName '1.3'
        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']
    }

    // Stały klucz podpisu. Bez niego GitHub przy każdym budowaniu tworzy nowy, losowy klucz,
    // a Android odmawia instalacji aktualizacji podpisanej innym kluczem.
    signingConfigs {
        debug {
            storeFile signingKeyFile()
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

